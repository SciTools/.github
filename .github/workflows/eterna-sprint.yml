name: Eterna Sprint
on:
  schedule:
    - cron: "50 03 * * *"
  workflow_dispatch:
    inputs:
      update_loop_minutes:
        description: "Number of minutes to keep updating for, after full refresh."
        required: true
        default: 0

jobs:
  update_eterna_sprint_project:
    name: "Update Eterna Sprint Project Board"
    if: github.repository == 'SciTools/.github'
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Generate token
        id: generate_token
        uses: tibdex/github-app-token@v1
        with:
          app_id: ${{ secrets.AUTH_APP_ID }}
          private_key: ${{ secrets.AUTH_APP_PRIVATE_KEY }}

      - name: "Checkout repo"
        uses: actions/checkout@v3

      - name: "Set up environment"
        run: conda install -c conda-forge --file eterna-sprint/requirements.txt

      - name: "Update the Eterna Sprint Project"
        run: |
          if [ -z "${{ github.event.inputs.update_loop_minutes }}" ]; then
            update_loop_minutes=0
          else
             update_loop_minutes=${{ github.event.inputs.update_loop_minutes }}
          fi
          $CONDA/bin/python eterna-sprint/update_project.py \
            --verbose \
            --bearer_token "${{ steps.generate_token.outputs.token }}" \
            --update_loop_minutes $update_loop_minutes
